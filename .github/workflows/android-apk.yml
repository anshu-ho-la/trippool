name: Build Android APK

# Runs on every push to the main branch, when started by hand from the Actions tab, and on a version tag such as
# v1.0.0. A tag also publishes the APK as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: Pick the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="1.0.${{ github.run_number }}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Restore the signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set: add the signing secrets first (see .github/SETUP.md)." >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/trippool.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/trippool.jks" >> "$GITHUB_ENV"

      - name: Run the unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest

      - name: Build the release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PtripVersionCode="${{ github.run_number }}" \
            -PtripVersionName="${{ steps.version.outputs.name }}"

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk trip-pool.apk

      - uses: actions/upload-artifact@v4
        with:
          name: trip-pool-apk
          path: trip-pool.apk
          retention-days: 30

      - name: Publish a release for a version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" trip-pool.apk --title "${{ github.ref_name }}" --generate-notes
